name: instant_grrocery_delivery
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  retrofit: 4.9.1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  google_fonts: ^6.3.3
  device_preview: ^1.3.1
  material_dialogs: ^1.1.5
  flutter_hooks: ^0.21.3+1
  go_router: ^12.0.0
  supercharged: ^2.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  riverpod_generator: ^3.0.3 
  hive_ce_generator: ^1.10.0
  retrofit_generator: 10.1.0
  json_serializable: ^6.10.0
  freezed: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/fruit/
